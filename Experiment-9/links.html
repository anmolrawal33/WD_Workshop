<!DOCTYPE html>
<html>
<head>
    <title>CSS Background and Link Styles</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;

            /* Repeating background pattern */
            background-image:
                repeating-linear-gradient(
                    45deg,
                    #e0f2fe 0px,
                    #e0f2fe 10px,
                    #f8fafc 10px,
                    #f8fafc 20px
                );

            background-repeat: repeat;
        }

        h1 {
            text-align: center;
            color: #003366;
        }

        .content {
            margin: 40px auto;
            max-width: 600px;
            padding: 25px;
            background-color: white;
            border: 1px solid #aaa;
            border-radius: 10px;
        }

        /* Unvisited link */
        a:link {
            color: blue;
            text-decoration: none;
        }

        /* Visited link */
        a:visited {
            color: purple;
        }

        /* Mouse hovering over a link */
        a:hover {
            color: red;
            text-decoration: underline;
        }

        /* Link while being clicked */
        a:active {
            color: green;
        }

        a {
            font-size: 18px;
            margin: 10px;
        }
    </style>
</head>

<body>
    <div class="content">
        <h1>CSS Link Styles</h1>

        <p>Move your mouse over the links to see their styles.</p>

        <p>
            <a href="https://www.google.com">Google</a>
        </p>

        <p>
            <a href="https://www.wikipedia.org">Wikipedia</a>
        </p>

        <p>
            <a href="https://www.github.com">GitHub</a>
        </p>
    </div>
</body>
</html>
