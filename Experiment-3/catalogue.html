<!DOCTYPE html>
<html>
<head>
    <title>Book Catalogue</title>

    <style>
        body {
            background-color: #fff0f5;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            color: #8b008b;
        }

        table {
            width: 95%;
            margin: auto;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #555;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #dda0dd;
        }

        .cover {
            display: inline-block;
            padding: 25px 10px;
            background-color: #e6e6fa;
            color: #4b0082;
            font-weight: bold;
            border: 1px solid #9370db;
        }

        button {
            padding: 8px 12px;
            background: #8b008b;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Book Catalogue</h1>

    <table>
        <tr>
            <th>Book Cover</th>
            <th>Book Details</th>
            <th>Price</th>
            <th>Action</th>
        </tr>

        <tr>
            <td><div class="cover">WEB<br>TECHNOLOGIES</div></td>
            <td>
                <b>Web Technologies</b><br>
                Author: Uttam K. Roy<br>
                Publisher: Oxford University Press
            </td>
            <td>₹531</td>
            <td>
                <button onclick="addBook('Web Technologies', 531)">
                    Add to Cart
                </button>
            </td>
        </tr>

        <tr>
            <td><div class="cover">PHP &<br>MYSQL</div></td>
            <td>
                <b>PHP & MySQL Web Development</b><br>
                Author: Luke Welling and Laura Thompson<br>
                Publisher: Pearson
            </td>
            <td>₹898</td>
            <td>
                <button onclick="addBook('PHP & MySQL Web Development', 898)">
                    Add to Cart
                </button>
            </td>
        </tr>
    </table>

    <p id="message" style="text-align:center;"></p>

    <script>
        function addBook(name, price) {
            let cart = JSON.parse(localStorage.getItem("bookCart")) || [];

            cart.push({ name: name, price: price });

            localStorage.setItem("bookCart", JSON.stringify(cart));

            document.getElementById("message").textContent =
                name + " added to cart!";
        }
    </script>
</body>
</html>
