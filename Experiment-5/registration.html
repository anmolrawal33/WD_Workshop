<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e6f2ff;
        }

        .container {
            max-width: 500px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #004080;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"],
        input[type="tel"],
        textarea,
        select {
            padding: 8px;
            margin: 6px 0 15px;
            box-sizing: border-box;
        }

        .wide {
            width: 100%;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Registration Form</h1>

        <form onsubmit="registerUser(event)">
            <label for="name">Name:</label>
            <input class="wide" type="text" id="name" required>

            <label for="password">Password:</label>
            <input class="wide" type="password" id="password" required>

            <label for="email">Email ID:</label>
            <input class="wide" type="email" id="email" required>

            <label for="phone">Phone Number:</label>
            <input class="wide" type="tel" id="phone" required>

            <p>Sex:</p>
            <label>
                <input type="radio" name="sex" value="Male" required> Male
            </label>
            <label>
                <input type="radio" name="sex" value="Female"> Female
            </label>
            <label>
                <input type="radio" name="sex" value="Other"> Other
            </label>

            <p>Date of Birth:</p>
            <select id="day" required>
                <option value="">Day</option>
                <script>
                    for (let d = 1; d <= 31; d++) {
                        document.write(`<option value="${d}">${d}</option>`);
                    }
                </script>
            </select>

            <select id="month" required>
                <option value="">Month</option>
                <script>
                    for (let m = 1; m <= 12; m++) {
                        document.write(`<option value="${m}">${m}</option>`);
                    }
                </script>
            </select>

            <select id="year" required>
                <option value="">Year</option>
                <script>
                    for (let y = 2026; y >= 1950; y--) {
                        document.write(`<option value="${y}">${y}</option>`);
                    }
                </script>
            </select>

            <p>Languages Known:</p>
            <label><input type="checkbox" name="language" value="English"> English</label>
            <label><input type="checkbox" name="language" value="Telugu"> Telugu</label>
            <label><input type="checkbox" name="language" value="Hindi"> Hindi</label>
            <label><input type="checkbox" name="language" value="Tamil"> Tamil</label>

            <p><label for="address">Address:</label></p>
            <textarea class="wide" id="address" rows="4"></textarea>

            <button type="submit">Register</button>
            <button type="reset">Reset</button>
        </form>

        <p id="result"></p>
    </div>

    <script>
        function registerUser(event) {
            event.preventDefault();

            document.getElementById("result").textContent =
                "Registration form submitted successfully!";

            alert("Registration successful!");
        }
    </script>
</body>
</html>
